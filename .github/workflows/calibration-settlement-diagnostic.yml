name: Calibration settlement diagnostic (no OddsPapi)
on:
  push:
    paths:
      - '.github/workflows/calibration-settlement-diagnostic.yml'
  schedule:
    - cron: '31 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Audit and settle saved predictions only
        env:
          NBA_STATS_ACCESS_TOKEN: ${{ secrets.NBA_STATS_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error, time
          base = "https://nba-stats-4.onrender.com"
          token = os.environ.get("NBA_STATS_ACCESS_TOKEN")
          if not token:
              raise SystemExit("NBA_STATS_ACCESS_TOKEN secret not configured")
          def call(path, method="GET"):
              req = urllib.request.Request(base+path, method=method,
                  headers={"Authorization":"Bearer "+token, "Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=180) as response:
                      return json.load(response)
              except urllib.error.HTTPError as e:
                  print("HTTP",e.code,"on",path,flush=True)
                  raise
          from datetime import datetime
          from zoneinfo import ZoneInfo
          today = datetime.now(ZoneInfo("Europe/Rome")).date().isoformat()
          dates = ("2026-10-23","2026-10-24")
          ready = []
          for day in dates:
              if day > today:
                  print("SKIP future local date",day,flush=True)
                  continue
              try:
                  result = call("/api/calibration/dry-run?date="+day)
                  print("AUDIT",day,json.dumps(result,ensure_ascii=False),flush=True)
                  if result.get("can_settle"):
                      ready.append(day)
              except urllib.error.HTTPError as e:
                  if e.code == 422 and day == today:
                      print("DEPLOY_PENDING: Render still rejects current-day audit",day,flush=True)
                      continue
                  raise
          result = call("/api/calibration/settle",method="POST")
          print("SETTLEMENT",json.dumps(result,ensure_ascii=False),flush=True)
          try:
              status = call("/api/calibration/settlement-status")
              print("COMMITTED",json.dumps(status,ensure_ascii=False),flush=True)
              committed = {row["date"] for row in status["settled"] if row["bins"] > 0}
              missing = [day for day in ready if day not in committed]
              if missing:
                  raise SystemExit("ERROR: ESPN-ready dates not committed: "+", ".join(missing))
          except urllib.error.HTTPError as e:
              if e.code == 404:
                  print("DEPLOY_PENDING: settlement status endpoint not deployed; verified settlement API results only",flush=True)
              raise
          PY
