name: NBA STATS - scansioni automatiche

on:
  schedule:
    # Five daily slots in Europe/Rome: 00, 10, 14, 18, 22.
    # Both UTC offsets are listed for daylight saving time. The Python
    # scheduler identifies the exact slot from github.event.schedule and
    # skips the inactive offset, including when GitHub starts late.
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
    - cron: "0 20 * * *"
    - cron: "0 21 * * *"
    - cron: "0 22 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modalità (test senza OddsPapi oppure scansione reale)'
        required: true
        type: choice
        default: test
        options:
          - test
          - scan

permissions:
  contents: read

concurrency:
  group: nba-stats-auto-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check secret and scan upcoming games
        env:
          NBA_STATS_ACCESS_TOKEN: ${{ secrets.NBA_STATS_ACCESS_TOKEN }}
          NBA_STATS_SCHEDULE: ${{ github.event.schedule }}
          NBA_STATS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'scan' && '1' || '0' }}
          NBA_STATS_MANUAL_SCAN: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'scan' && '1' || '0' }}
        run: python scripts/scheduled_scan.py
