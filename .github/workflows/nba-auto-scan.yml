name: NBA STATS - scansioni automatiche

on:
  schedule:
    # Recovery heartbeat: GitHub may delay or drop individual cron events.
    # Supabase atomic slot claims prevent repeated OddsPapi scans.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modalità (test senza OddsPapi oppure scansione reale)'
        required: true
        type: choice
        default: test
        options:
          - test
          - scan

permissions:
  contents: read

concurrency:
  group: nba-stats-auto-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check secret and scan upcoming games
        env:
          NBA_STATS_ACCESS_TOKEN: ${{ secrets.NBA_STATS_ACCESS_TOKEN }}
          NBA_STATS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'scan' && '1' || '0' }}
          NBA_STATS_MANUAL_SCAN: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'scan' && '1' || '0' }}
        run: python scripts/scheduled_scan.py
