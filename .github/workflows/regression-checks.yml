name: Basket Lab regression checks

on:
  push:
    branches: [main]
    paths:
      - 'calibration.py'
      - 'scripts/audit_calibration.py'
      - 'tests/**'
      - 'web/*.js'
      - '.github/workflows/regression-checks.yml'
  pull_request:
    paths:
      - 'calibration.py'
      - 'scripts/audit_calibration.py'
      - 'tests/**'
      - 'web/*.js'
      - '.github/workflows/regression-checks.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q calibration.py scripts/audit_calibration.py tests
      - name: Test calibration audit
        run: python -m unittest discover -s tests -p 'test_calibration_audit.py' -v
      - name: Check browser JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/features.js
          node --check web/hub-nav.js
          node --check web/audience.js
