name: Calibration offline tests
on:
  pull_request:
    paths:
      - 'calibration.py'
      - 'main.py'
      - 'engine.py'
      - 'tests/test_player_identity.py'
      - 'tests/test_espn_coverage.py'
      - 'tests/test_espn_conflicts.py'
      - 'storage.py'
      - 'scripts/espn_smoke_test.py'
      - 'scripts/archive_audit.py'
      - 'tests/test_archive_audit.py'
      - 'scripts/verify_archive.py'
      - 'tests/test_verify_archive.py'
      - 'settle_espn.py'
      - 'calibration_validation.py'
      - 'tests/test_calibration_validation.py'
      - 'tests/test_calendar_boundaries.py'
      - 'tests/test_calibration.py'
      - 'tests/test_settle_espn.py'
      - '.github/workflows/calibration-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_calibration.py' -v
      - run: python -m unittest discover -s tests -p 'test_settle_espn.py' -v
      - run: python -m unittest discover -s tests -p 'test_calibration_validation.py' -v
      - run: python -m unittest discover -s tests -p 'test_calendar_boundaries.py' -v
      - run: python -m unittest discover -s tests -p 'test_archive_audit.py' -v
      - run: python -m unittest discover -s tests -p 'test_verify_archive.py' -v
      - run: python -m unittest discover -s tests -p 'test_player_identity.py' -v
      - run: python -m unittest discover -s tests -p 'test_espn_coverage.py' -v
      - run: python -m unittest discover -s tests -p 'test_espn_conflicts.py' -v
      - run: python -m compileall -q main.py storage.py settle_espn.py calibration.py calibration_validation.py scripts/espn_smoke_test.py scripts/verify_archive.py
