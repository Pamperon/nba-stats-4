name: Complete offline checks
on:
  push:
    paths:
      - '**/*.py'
      - 'web/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'package*.json'
      - '.github/workflows/calibration-tests.yml'
  pull_request:
    paths:
      - '**/*.py'
      - 'web/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'package*.json'
      - '.github/workflows/calibration-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: python scripts/run_offline_tests.py
      - run: python -m compileall -q main.py engine.py storage.py player_stats.py calibration.py calibration_validation.py progressive_calibration.py minutes_shadow.py performance_report.py settle_espn.py scripts tests
      - run: npm ci --ignore-scripts
      - run: npm test
