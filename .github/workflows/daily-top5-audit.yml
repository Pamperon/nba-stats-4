name: Daily Top 5 historical audit (read only)
on:
  push:
    branches: [feature/unified-daily-lines-v1]
    paths:
      - '.github/workflows/daily-top5-audit.yml'
  workflow_dispatch:
jobs:
  historical-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run deterministic offline regression tests
        run: python -m unittest tests.test_daily_top5_backtest -v
      - name: Audit archived pregame snapshots with finalized ESPN scores
        run: |
          python -m scripts.daily_top5_backtest --dates 2026-10-23 2026-10-24 2026-10-25 2026-10-26 2026-10-27 2026-10-28 2026-10-29 2026-10-30 > daily-top5-audit.json
          python - <<'PY'
          import json
          with open('daily-top5-audit.json') as f:
              report=json.load(f)
          print('Days evaluated:',len(report['daily']))
          print('Days skipped:',len(report['skipped']))
          for d in report['daily']:
              print(d['date'],'top5:',d['top5'],'remaining:',d['remaining'])
          for d in report['skipped']:
              print('Skipped:',d)
          if not report['daily']:
              raise SystemExit('No valid historical snapshots available')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-top5-historical-audit
          path: daily-top5-audit.json
          if-no-files-found: warn
