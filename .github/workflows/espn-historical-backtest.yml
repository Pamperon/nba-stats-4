name: Offline ESPN historical prop backtest
on:
  pull_request:
    paths:
      - 'scripts/espn_prop_backtest.py'
      - 'tests/test_espn_prop_backtest.py'
      - '.github/workflows/espn-historical-backtest.yml'
  workflow_dispatch:
    inputs:
      start:
        description: First historical scan date (YYYY-MM-DD)
        required: true
        default: '2026-10-23'
        type: string
      end:
        description: Last historical scan date (YYYY-MM-DD)
        required: true
        default: '2026-10-30'
        type: string

permissions:
  contents: read

jobs:
  unit-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3' 'psycopg[binary]>=3.2,<4'
      - run: python -m unittest discover -s tests -p 'test_espn_prop_backtest.py'
  historical-backtest:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline audit dependencies
        run: python -m pip install 'requests>=2.31,<3' 'psycopg[binary]>=3.2,<4'
      - name: Unit tests (no network/database)
        run: python -m unittest discover -s tests -p 'test_espn_prop_backtest.py'
      - name: Check database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret missing. Historical audit cannot run."
            exit 1
          fi
      - name: Read archived predictions and retrieve public ESPN final scores
        run: python scripts/espn_prop_backtest.py --start "${{ inputs.start }}" --end "${{ inputs.end }}" --output espn_prop_backtest_report.json
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espn-prop-backtest-report
          path: espn_prop_backtest_report.json
          if-no-files-found: ignore
          retention-days: 14
