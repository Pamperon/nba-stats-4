name: ESPN backtest - manual launcher
on:
  workflow_dispatch:
    inputs:
      start:
        description: First archived date YYYY-MM-DD
        required: true
        default: '2026-10-23'
        type: string
      end:
        description: Last archived date YYYY-MM-DD
        required: true
        default: '2026-10-30'
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout pinned audit revision (not production main)
        uses: actions/checkout@v4
        with:
          ref: 91d3d55e0b07d5645a421baafb3e82d043248f94
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: python -m pip install 'requests>=2.31,<3' 'psycopg[binary]>=3.2,<4'
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_espn_prop_backtest.py'
      - name: Require database connection
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not configured in GitHub Actions secrets"
            exit 1
          fi
      - name: ESPN historical backtest (read-only)
        run: python scripts/espn_prop_backtest.py --start "${{ inputs.start }}" --end "${{ inputs.end }}" --output espn_prop_backtest_report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espn-historical-backtest-report
          path: espn_prop_backtest_report.json
          if-no-files-found: ignore
          retention-days: 14
