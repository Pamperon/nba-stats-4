name: Progressive preview tests
on:
  push:
    branches: [main]
    paths:
      - 'public_views.py'
      - 'tests/test_progressive_preview.py'
      - '.github/workflows/progressive-preview-tests.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal test dependency
        run: python -m pip install 'psycopg[binary]>=3.1'
      - name: Validate Python source syntax
        run: python -m compileall -q main.py official_top5.py scripts/scheduled_scan.py
      - name: Run progressive selection tests
        run: python -m unittest discover -s tests -p 'test_progressive_preview.py' -v
