name: Verify deployed Basket Lab
# Run after publication: waiting for Render in a required CI check can deadlock deployment.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: basketlab-deployment-smoke
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Verify exact deployment and protected monitoring
        env:
          NBA_STATS_ACCESS_TOKEN: ${{ secrets.NBA_STATS_ACCESS_TOKEN }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error
          base = 'https://basketlab.it'
          expected = os.environ['EXPECTED_COMMIT']
          token = os.environ.get('NBA_STATS_ACCESS_TOKEN')
          if not token:
              raise SystemExit('Administrative access secret is missing')
          def get(path, authorized=False):
              headers = {'Accept': 'application/json'}
              if authorized:
                  headers['Authorization'] = 'Bearer ' + token
              req = urllib.request.Request(base + path, headers=headers)
              with urllib.request.urlopen(req, timeout=25) as response:
                  return json.load(response), response.headers
          deadline = time.monotonic() + 900
          while time.monotonic() < deadline:
              try:
                  health, _ = get('/api/health')
                  if health.get('deployment_commit') == expected:
                      break
              except (urllib.error.URLError, TimeoutError, ValueError):
                  pass
              time.sleep(20)
          else:
              raise SystemExit('Expected commit did not become publicly available within 15 minutes')
          assert health['status'] == 'ok' and health['scan_tracking_ready'] is True
          assert health['live_calibration_enabled'] is False
          try:
              get('/api/admin/monitor')
          except urllib.error.HTTPError as error:
              assert error.code == 401, error.code
          else:
              raise AssertionError('Monitoring data must require authentication')
          monitor, headers = get('/api/admin/monitor', authorized=True)
          assert headers.get('Cache-Control') == 'no-store'
          assert monitor['read_only'] is True and monitor['odds_api_calls'] == 0
          assert all(row['matched'] <= row['expected'] for row in monitor['coverage'])
          for path in ('/api/saved/dates', '/api/history/dates', '/api/picks/session?compact=true'):
              data, _ = get(path)
              if path.startswith('/api/picks/session'):
                  assert data['results'] == [] and isinstance(data['quote_count'], int)
                  assert len(data.get('preliminary_top5', [])) <= 5
          print(json.dumps({'verified_commit': expected, 'monitor_authenticated': True,
                            'coverage_days': len(monitor['coverage']), 'odds_api_calls': 0}))
          PY
